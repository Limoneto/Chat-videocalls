name: CI

on:
  push:
    branches: [comvi-demo]
  pull_request:
    branches: [comvi-demo]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000:web:000"
          NEXT_PUBLIC_LIVEKIT_URL: wss://test.livekit.cloud
          NEXT_PUBLIC_GIPHY_API_KEY: test
          LIVEKIT_API_KEY: test
          LIVEKIT_API_SECRET: test

      - name: Verificar build output
        run: |
          echo "Build completado"
          ls -la .next/
          echo "Paginas estaticas:"
          ls -la .next/server/app/ 2>/dev/null || echo "SSR mode"
